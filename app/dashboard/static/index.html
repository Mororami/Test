<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>김프 대시보드</title>
<link rel="icon" href="data:,">
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --border:rgba(11,11,11,.10); --neutral:#f0efec; --wash:rgba(11,11,11,.04);
  --up:#e34948; --down:#2a78d6;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --border:rgba(255,255,255,.10); --neutral:#383835; --wash:rgba(255,255,255,.05);
    --up:#e66767; --down:#3987e5;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --border:rgba(255,255,255,.10); --neutral:#383835; --wash:rgba(255,255,255,.05);
  --up:#e66767; --down:#3987e5;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.4}
.wrap{max-width:1320px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:16px}
h1{font-size:20px;margin:0;font-weight:650}
.status{color:var(--ink-2);font-size:13px;flex:1 1 auto}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid var(--border);color:var(--ink-2);margin-left:6px;vertical-align:1px}
.badge.warn{border-color:var(--up)}
button,select,input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px}
button{cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;min-width:0}
.tile .label{font-size:13px;color:var(--ink-2)}
.tile .value{font-size:28px;font-weight:600;margin-top:2px;letter-spacing:-.01em}
.tile .sub{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0 10px}
.filters .spacer{flex:1}
.count{color:var(--muted);font-size:12px}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:auto;max-height:calc(100vh - 140px)}
table{border-collapse:collapse;width:100%;min-width:1100px;font-variant-numeric:tabular-nums}
thead th{position:sticky;top:0;z-index:1;background:var(--surface);text-align:right;font-size:12px;font-weight:600;color:var(--ink-2);padding:10px 12px;border-bottom:1px solid var(--grid);cursor:pointer;white-space:nowrap;user-select:none}
thead th.active{color:var(--ink)}
thead th .dir{font-size:10px;margin-left:3px;color:var(--muted)}
th.sym,td.sym{text-align:left}
td{padding:7px 12px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--wash)}
td.sym{font-weight:600}
.na{color:var(--muted)}
tr.hl td.kimp-cell .v{font-weight:600}
.kimp{display:inline-flex;align-items:center;gap:10px;justify-content:flex-end}
.kimp .v{min-width:64px;display:inline-block}
.bar{position:relative;width:96px;height:8px;background:var(--neutral);border-radius:4px;overflow:hidden;flex:none}
.bar::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--border)}
.bar i{position:absolute;top:0;height:100%}
.bar i.pos{left:50%;background:var(--up);border-radius:0 4px 4px 0}
.bar i.neg{right:50%;background:var(--down);border-radius:4px 0 0 4px}
.tri{display:inline-block;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;margin-right:6px;vertical-align:1px}
.tri.up{border-bottom:7px solid var(--up)}
.tri.down{border-top:7px solid var(--down)}
.tri.flat{width:7px;height:2px;background:var(--muted);border:0;vertical-align:3px}
.dim{opacity:.55;transition:opacity .2s}
section.alerts{margin-top:18px}
section.alerts h2{font-size:15px;margin:0 0 8px;font-weight:600}
.alert-list{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:6px 0;max-height:300px;overflow:auto}
.alert{display:grid;grid-template-columns:64px 56px 1fr;gap:10px;padding:7px 14px;font-size:13px;align-items:baseline;border-bottom:1px solid var(--grid)}
.alert:last-child{border-bottom:0}
.alert .t{color:var(--muted);font-variant-numeric:tabular-nums}
.alert .k{color:var(--ink-2)}
.alert .msg{white-space:pre-wrap;color:var(--ink);overflow-wrap:anywhere}
.empty{padding:14px;color:var(--muted);font-size:13px}
.star{cursor:pointer;color:var(--muted);font-size:16px;line-height:1;background:none;border:0;padding:2px 4px;border-radius:6px;user-select:none}
.star:hover{background:var(--wash)}
.star.on{color:#e0a800}
th.fav,td.fav{width:34px;padding-left:10px;padding-right:0;text-align:center}
footer{margin:16px 0 8px;color:var(--muted);font-size:12px;line-height:1.6}
@media (max-width:640px){h1{font-size:18px}.tile .value{font-size:24px}.bar{width:64px}.alert{grid-template-columns:56px 1fr}.alert .k{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Bitkub × Bithumb 김프 대시보드</h1>
    <div class="status" id="status">불러오는 중…</div>
    <button id="theme" type="button" title="테마 전환">🌓</button>
  </header>

  <div class="tiles" id="tiles"></div>

  <div class="filters">
    <input id="q" type="search" placeholder="코인 검색 (예: BTC)" autocomplete="off">
    <select id="listing">
      <option value="fav">즐겨찾기만</option>
      <option value="both" selected>Bithumb 상장 코인만</option>
      <option value="all">Bitkub 전체</option>
      <option value="only">Bithumb 미상장만</option>
    </select>
    <select id="minvol">
      <option value="0">거래대금 제한 없음</option>
      <option value="100000">Bitkub 24h ≥ 100K THB</option>
      <option value="1000000">Bitkub 24h ≥ 1M THB</option>
      <option value="10000000">Bitkub 24h ≥ 10M THB</option>
    </select>
    <span class="spacer"></span>
    <span class="count" id="count"></span>
  </div>

  <div class="table-wrap" id="tablewrap">
    <table>
      <thead><tr id="thead"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <section class="alerts">
    <h2>최근 알림</h2>
    <div class="alert-list" id="alerts"><div class="empty">아직 알림이 없습니다.</div></div>
  </section>

  <footer>
    김프(%) = (Bithumb KRW ÷ (Bitkub THB × 환율) − 1) × 100. 양수면 Bithumb 이 더 비쌉니다. "동명이인?" 은 티커만 같은 다른 코인으로 의심되는 행입니다.<br>
    데이터: Bitkub · Bithumb 공개 API, 환율: frankfurter(ECB) / exchangerate-api, USDT 내재환율 = Bithumb KRW-USDT ÷ Bitkub USDT_THB.
  </footer>
</div>

<script>
(function () {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const KIMP_BAR_CAP = 10;          // |김프| 10% 이상이면 막대가 가득 찬다
  const REFRESH_MS = 10000;

  const state = {
    snap: null, meta: {}, alerts: [],
    sort: { key: 'kimp_pct', dir: 'desc' },
    q: '', listing: 'both', minvol: 0, failed: false,
  };

  // ---- 즐겨찾기 (이 브라우저의 localStorage 에만 저장) ---------------------
  const FAV_KEY = 'kimp-favorites';
  let favorites = new Set();
  try { favorites = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]')); } catch (e) { /* 저장소 사용 불가 */ }
  function toggleFavorite(sym) {
    if (favorites.has(sym)) favorites.delete(sym); else favorites.add(sym);
    try { localStorage.setItem(FAV_KEY, JSON.stringify([...favorites])); } catch (e) { /* 무시 */ }
    renderBody();
  }

  // ---- 포맷 ----------------------------------------------------------
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const isNum = (v) => typeof v === 'number' && Number.isFinite(v);
  function fmtNum(v) {
    if (!isNum(v)) return '-';
    const a = Math.abs(v);
    if (a >= 1000) return v.toLocaleString('en-US', { maximumFractionDigits: 0 });
    if (a >= 1) return v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    if (a >= 0.01) return v.toFixed(4);
    const digits = Math.min(12, 3 - Math.floor(Math.log10(a)));   // 유효숫자 4자리, 지수 표기 없이
    return v.toFixed(digits).replace(/0+$/, '').replace(/\.$/, '');
  }
  function fmtKrw(v) {
    if (!isNum(v)) return '-';
    const a = Math.abs(v);
    if (a >= 100) return v.toLocaleString('en-US', { maximumFractionDigits: 0 });
    if (a >= 1) return v.toFixed(2);
    return v.toFixed(4);
  }
  const fmtPct = (v, d = 2) => isNum(v) ? (v > 0 ? '+' : '') + v.toFixed(d) + '%' : '-';
  function fmtCompact(v) {
    if (!isNum(v)) return '-';
    const a = Math.abs(v);
    if (a >= 1e9) return (v / 1e9).toFixed(1) + 'B';
    if (a >= 1e6) return (v / 1e6).toFixed(1) + 'M';
    if (a >= 1e3) return (v / 1e3).toFixed(1) + 'K';
    return v.toFixed(0);
  }
  const fmtTime = (ts) => new Date(ts * 1000).toLocaleTimeString('ko-KR', { hour12: false });
  const stripTags = (s) => String(s).replace(/<[^>]+>/g, '');

  // ---- 셀 렌더 ---------------------------------------------------------
  function kimpCell(r) {
    const v = r.kimp_pct;
    if (!isNum(v)) return '<span class="na">-</span>';
    if (r.suspect) return `<span class="kimp"><span class="badge" title="티커는 같지만 다른 코인일 가능성이 큽니다 (김프 절대값이 기준 이상). 알림·통계에서 제외됨">동명이인?</span><span class="v na">${fmtPct(v)}</span></span>`;
    const w = Math.min(Math.abs(v) / KIMP_BAR_CAP, 1) * 50;
    return `<span class="kimp"><span class="bar"><i class="${v >= 0 ? 'pos' : 'neg'}" style="width:${w.toFixed(1)}%"></i></span><span class="v">${fmtPct(v)}</span></span>`;
  }
  function deltaCell(v) {
    if (!isNum(v)) return '<span class="na">-</span>';
    const cls = v > 0.005 ? 'up' : v < -0.005 ? 'down' : 'flat';
    return `<span class="tri ${cls}"></span>${fmtPct(v)}`;
  }

  const COLS = [
    { key: 'fav', label: '★', cls: 'fav', nosort: true, html: (r) => `<button class="star ${favorites.has(r.symbol) ? 'on' : ''}" data-sym="${esc(r.symbol)}" title="즐겨찾기">${favorites.has(r.symbol) ? '★' : '☆'}</button>` },
    { key: 'symbol', label: '코인', cls: 'sym', text: (r) => r.symbol, asc: true },
    { key: 'bitkub_thb', label: 'Bitkub (THB)', text: (r) => fmtNum(r.bitkub_thb) },
    { key: 'bitkub_krw', label: 'Bitkub 환산 (KRW)', text: (r) => fmtKrw(r.bitkub_krw) },
    { key: 'bithumb_krw', label: 'Bithumb (KRW)', text: (r) => fmtKrw(r.bithumb_krw) },
    { key: 'kimp_pct', label: '김프', cls: 'kimp-cell', html: (r) => kimpCell(r) },
    { key: 'change_short_pct', label: () => `${state.snap ? state.snap.short_window_min : 5}분 (Bitkub)`, html: (r) => deltaCell(r.change_short_pct) },
    { key: 'bitkub_change_24h_pct', label: '24h Bitkub', html: (r) => deltaCell(r.bitkub_change_24h_pct) },
    { key: 'bithumb_change_24h_pct', label: '24h Bithumb', html: (r) => deltaCell(r.bithumb_change_24h_pct) },
    { key: 'bitkub_volume_thb', label: '거래대금 Bitkub (THB)', text: (r) => fmtCompact(r.bitkub_volume_thb) },
    { key: 'bithumb_volume_krw', label: '거래대금 Bithumb (KRW)', text: (r) => fmtCompact(r.bithumb_volume_krw) },
  ];

  // ---- 데이터 가공 -----------------------------------------------------
  function visibleRows() {
    if (!state.snap) return [];
    const q = state.q.trim().toUpperCase();
    let rows = state.snap.rows.filter((r) => {
      if (q && !r.symbol.includes(q)) return false;
      if (state.listing === 'fav' && !favorites.has(r.symbol)) return false;
      if (state.listing === 'both' && !isNum(r.kimp_pct)) return false;
      if (state.listing === 'only' && isNum(r.bithumb_krw)) return false;
      if (state.minvol > 0 && !(isNum(r.bitkub_volume_thb) && r.bitkub_volume_thb >= state.minvol)) return false;
      return true;
    });
    const { key, dir } = state.sort;
    const sign = dir === 'asc' ? 1 : -1;
    rows.sort((a, b) => {
      const fa = favorites.has(a.symbol), fb = favorites.has(b.symbol);
      if (fa !== fb) return fa ? -1 : 1;              // 즐겨찾기는 항상 맨 위
      const x = a[key], y = b[key];
      if (key === 'symbol') return sign * x.localeCompare(y);
      const xn = isNum(x), yn = isNum(y);
      if (!xn && !yn) return a.symbol.localeCompare(b.symbol);
      if (!xn) return 1;              // 값 없는 행은 항상 아래
      if (!yn) return -1;
      return sign * (x - y) || a.symbol.localeCompare(b.symbol);
    });
    return rows;
  }

  // ---- 렌더 -------------------------------------------------------------
  function renderTiles() {
    const s = state.snap, st = s.stats, fx = s.forex, used = s.rate_used, implied = s.usdt_implied_thb_krw;
    const usedTag = (src) => used.source === src ? ' · 김프 계산에 사용' : '';
    const tiles = [
      {
        label: '외환 환율 (1 THB → KRW)',
        value: fx ? fx.thb_krw.toFixed(3) : (used.source === 'override' ? used.thb_krw.toFixed(3) : '-'),
        sub: fx ? `${fx.source}${fx.as_of ? ' · ' + fx.as_of : ''}${usedTag(fx.source)}`
                : (used.source === 'override' ? '수동 고정값 · 김프 계산에 사용' : '환율 조회 실패'),
      },
      {
        label: 'USDT 내재환율 (KRW/USDT ÷ THB/USDT)',
        value: isNum(implied) ? implied.toFixed(3) : '-',
        sub: (isNum(implied) && fx ? `외환 대비 ${fmtPct((implied / fx.thb_krw - 1) * 100)}` : 'USDT 시세 없음') + usedTag('usdt_implied'),
      },
      {
        label: '비교 가능 코인',
        value: String(st.matched_count),
        sub: `Bitkub ${st.bitkub_count} · Bithumb ${st.bithumb_count}`,
      },
      {
        label: '김프 중간값',
        value: fmtPct(st.median_kimp_pct),
        sub: isNum(st.max_kimp_pct) ? `최고 ${st.max_kimp_symbol} ${fmtPct(st.max_kimp_pct)} · 최저 ${st.min_kimp_symbol} ${fmtPct(st.min_kimp_pct)}` : '',
      },
    ];
    $('#tiles').innerHTML = tiles.map((t) =>
      `<div class="tile"><div class="label">${esc(t.label)}</div><div class="value">${esc(t.value)}</div><div class="sub">${esc(t.sub)}</div></div>`).join('');
  }

  function renderHead() {
    $('#thead').innerHTML = COLS.map((c) => {
      const label = typeof c.label === 'function' ? c.label() : c.label;
      const active = state.sort.key === c.key;
      if (c.nosort) return `<th class="${c.cls}" style="cursor:default">${esc(label)}</th>`;
      const dir = active ? `<span class="dir">${state.sort.dir === 'asc' ? '▲' : '▼'}</span>` : '';
      return `<th class="${c.cls || ''} ${active ? 'active' : ''}" data-key="${c.key}">${esc(label)}${dir}</th>`;
    }).join('');
  }

  function renderBody() {
    const rows = visibleRows();
    const hl = state.meta.kimp_highlight_pct || 0;
    $('#tbody').innerHTML = rows.map((r) => {
      const cls = hl > 0 && isNum(r.kimp_pct) && !r.suspect && Math.abs(r.kimp_pct) >= hl ? 'hl' : '';
      const cells = COLS.map((c) => {
        const inner = c.html ? c.html(r) : esc(c.text(r));
        const na = !c.html && inner === '-' ? 'na' : '';
        return `<td class="${c.cls || ''} ${na}">${inner}</td>`;
      }).join('');
      return `<tr class="${cls}">${cells}</tr>`;
    }).join('');
    $('#count').textContent = `${rows.length} / ${state.snap ? state.snap.rows.length : 0} 코인`;
  }

  function renderStatus() {
    const s = state.snap, m = state.meta;
    if (!s) {
      $('#status').innerHTML = state.failed ? '<span class="badge warn">서버 연결 실패</span>' : '첫 수집을 기다리는 중…';
      return;
    }
    const age = (m.server_time || Date.now() / 1000) - s.ts;
    let html = `갱신 ${fmtTime(s.ts)} · ${m.poll_interval_sec}초 주기`;
    if (age > (m.poll_interval_sec || 30) * 3) html += `<span class="badge warn">${Math.round(age)}초 지연</span>`;
    if (isNum(s.bithumb_stale_sec)) html += `<span class="badge warn">Bithumb ${Math.round(s.bithumb_stale_sec)}초 전 데이터</span>`;
    if (m.last_error) html += `<span class="badge warn" title="${esc(m.last_error)}">수집 오류</span>`;
    if (state.failed) html += '<span class="badge warn">서버 연결 실패</span>';
    if (m.alerts_enabled) html += `<span class="badge">알람 ${m.telegram_configured ? 'Telegram' : '콘솔'}</span>`;
    $('#status').innerHTML = html;
  }

  const KIND = { pump: '급등', change_24h: '24h', kimp: '김프' };
  function renderAlerts() {
    const el = $('#alerts');
    if (!state.alerts.length) { el.innerHTML = '<div class="empty">아직 알림이 없습니다.</div>'; return; }
    el.innerHTML = state.alerts.map((a) =>
      `<div class="alert"><span class="t">${fmtTime(a.ts)}</span><span class="k">${esc(KIND[a.kind] || a.kind)}</span><span class="msg">${esc(stripTags(a.text))}</span></div>`).join('');
  }

  function renderAll() {
    if (state.snap) { renderTiles(); renderHead(); renderBody(); }
    renderStatus();
    $('#tablewrap').classList.toggle('dim', state.failed);
  }

  // ---- 데이터 로딩 -------------------------------------------------------
  async function refresh() {
    if (document.visibilityState === 'hidden') return;
    try {
      const [snapRes, alertRes] = await Promise.all([fetch('/api/snapshot', { cache: 'no-store' }), fetch('/api/alerts?limit=50', { cache: 'no-store' })]);
      if (!snapRes.ok) throw new Error(snapRes.status);
      const data = await snapRes.json();
      state.meta = data.meta || {};
      if (data.snapshot) state.snap = data.snapshot;
      if (alertRes.ok) state.alerts = (await alertRes.json()).alerts || [];
      state.failed = false;
    } catch (e) {
      state.failed = true;              // 이전 화면 유지, 흐리게만 표시
    }
    renderAll();
    renderAlerts();
  }

  // ---- 이벤트 ------------------------------------------------------------
  $('#thead').addEventListener('click', (ev) => {
    const th = ev.target.closest('th'); if (!th || !th.dataset.key) return;
    const key = th.dataset.key, col = COLS.find((c) => c.key === key);
    if (state.sort.key === key) state.sort.dir = state.sort.dir === 'asc' ? 'desc' : 'asc';
    else state.sort = { key, dir: col && col.asc ? 'asc' : 'desc' };
    renderHead(); renderBody();
  });
  $('#tbody').addEventListener('click', (ev) => { const b = ev.target.closest('.star'); if (b) toggleFavorite(b.dataset.sym); });
  $('#q').addEventListener('input', (ev) => { state.q = ev.target.value; renderBody(); });
  $('#listing').addEventListener('change', (ev) => { state.listing = ev.target.value; renderBody(); });
  $('#minvol').addEventListener('change', (ev) => { state.minvol = Number(ev.target.value); renderBody(); });

  // 테마: auto → dark → light 순환, 선택은 이 브라우저에만 기억
  const THEMES = ['auto', 'dark', 'light'];
  let theme = 'auto';
  try { theme = localStorage.getItem('kimp-theme') || 'auto'; } catch (e) { /* 저장소 불가 */ }
  function applyTheme() {
    if (theme === 'auto') delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = theme;
    $('#theme').textContent = theme === 'auto' ? '🌓' : theme === 'dark' ? '🌙' : '☀️';
  }
  $('#theme').addEventListener('click', () => {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    try { localStorage.setItem('kimp-theme', theme); } catch (e) { /* 저장소 불가 */ }
    applyTheme();
  });
  applyTheme();

  refresh();
  setInterval(refresh, REFRESH_MS);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
})();
</script>
</body>
</html>
